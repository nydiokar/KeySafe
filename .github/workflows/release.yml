name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Verify tag matches package version
        shell: python
        run: |
          import os, re, tomllib
          tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          with open("pyproject.toml", "rb") as f:
              toml_version = tomllib.load(f)["project"]["version"]
          init = open("secure_credentials/__init__.py", encoding="utf-8").read()
          init_version = re.search(r'__version__\s*=\s*"([^"]+)"', init).group(1)
          assert tag == toml_version == init_version, f"tag={tag} pyproject={toml_version} __init__={init_version}"
      - run: python -m pip install -e ".[dev]" build
      - run: python -m ruff check
      - run: python -m mypy
      - run: python -m pytest -q tests
      - name: Build GUI executable
        run: pyinstaller secure_credentials.spec --noconfirm
      - name: Build wheel and sdist (GUI + API via pip)
        run: python -m build
      - name: Checksums
        shell: bash
        run: |
          cd dist
          sha256sum *.exe *.whl *.tar.gz > SHA256SUMS.txt
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python .github/scripts/release_notes.py "$VERSION" > notes.md
          gh release create "$GITHUB_REF_NAME" dist/SecureCredentialManager.exe dist/*.whl dist/*.tar.gz dist/SHA256SUMS.txt --title "$GITHUB_REF_NAME" --notes-file notes.md
