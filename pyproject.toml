[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "secure_credentials"
version = "1.2.0"
description = "A secure credential manager with GUI interface"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
dependencies = [
    "ttkbootstrap>=1.13.0",
    "pykeepass>=4.1.1",
    "pyperclip>=1.9.0",
    "pillow>=10.0.0,<11.0.0",
    "pystray>=0.19.5",
    "packaging>=24.2",
    "requests>=2.32.3",
    "olefile>=0.47",
    "pywin32>=306",
    "python-dotenv>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.5",
    "black>=25.1.0",
    "pyinstaller>=6.14.2"
]

[project.scripts]
secure-credentials = "secure_credentials.src.run_app:main"

[tool.hatch.build.targets.wheel]
packages = ["secure_credentials"] 