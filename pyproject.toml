[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "secure_credentials"
version = "1.3.2"
description = "A secure credential manager with GUI interface"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "ttkbootstrap>=2.2.6",
    "pykeepass>=4.2.0",
    "pyperclip>=1.11.0",
    "pillow>=13.0.0",
    "pystray>=0.19.5",
    "packaging>=26.3",
    "requests>=2.34.2",
    "olefile>=0.47",
    "pywin32>=312; sys_platform == 'win32'",
    "python-dotenv>=1.2.4",
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
    "cryptography>=50.0.2"
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2.0",
    "httpx>=0.28.1",
    "black>=26.10.1",
    "pyinstaller>=6.22.3",
    "ruff>=0.15.0",
    "mypy>=1.20.0"
]

[project.scripts]
secure-credentials-api = "secure_credentials.src.api.server:main"

[tool.hatch.build.targets.wheel]
packages = ["secure_credentials"]

[tool.ruff]
target-version = "py310"
line-length = 120
include = ["secure_credentials/src/api/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
follow_imports = "silent"
files = ["secure_credentials/src/api"]
